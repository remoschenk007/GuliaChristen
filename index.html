/* Desktop: zoom out a bit so full rose fits */
@media(min-width:769px){
  .rose{
    background-position:center 38%;
    background-size:70%;  /* smaller on desktop = more visible */
    background-repeat:no-repeat;
  }
}

@keyframes roseIn{
  0%{opacity:0;transform:scale(1.05)}100%{opacity:1;transform:scale(1)}
}

.vig{
  position:fixed;inset:0;z-index:2;pointer-events:none;
  background:
    linear-gradient(to top,
      rgba(6,6,6,1.0) 0%,
      rgba(6,6,6,0.94) 14%,
      rgba(6,6,6,0.55) 30%,
      rgba(6,6,6,0.1)  50%,
      transparent 65%
    ),
    linear-gradient(to bottom,rgba(6,6,6,0.45) 0%,transparent 14%),
    linear-gradient(to right,rgba(6,6,6,0.6) 0%,transparent 18%,transparent 82%,rgba(6,6,6,0.6) 100%);
}

.grain{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0.42;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.72' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.045'/%3E%3C/svg%3E");
}

.sig-block{
  position:fixed;
  bottom:clamp(32px,5.5vh,65px);
  left:0;right:0;z-index:10;
  display:flex;flex-direction:column;
  align-items:center;
  gap:clamp(6px,1.1vh,11px);
  opacity:0;animation:up 1s 1.8s ease forwards;
}

.sig-img{
  display:block;height:auto;opacity:0.9;
  filter:drop-shadow(0 0 18px rgba(255,255,255,0.1));
  clip-path:inset(0 100% 0 0);
  animation:write 2.6s 2.2s cubic-bezier(0.2,0,0.08,1) forwards;
  width:clamp(260px,70vw,440px);
}
@media(min-width:769px){
  .sig-img{ width:clamp(240px,22vw,340px); }
}
@keyframes write{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0% 0 0)}}

.rule{width:0;height:1px;
  background:linear-gradient(to right,transparent,rgba(255,255,255,0.15),transparent);
  animation:grow 0.7s 5.1s ease forwards;}
@keyframes grow{to{width:clamp(55px,7vw,100px)}}

.city{
  font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;
  font-size:clamp(0.37rem,0.58vw,0.5rem);letter-spacing:0.66em;padding-right:0.66em;
  color:rgba(255,255,255,0);text-align:center;text-transform:uppercase;
  animation:fadeIn 1.2s 5.5s ease forwards;
}
.enter{
  position:fixed;bottom:clamp(9px,1.4vh,14px);
  left:0;right:0;text-align:center;display:block;
  font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;
  font-size:clamp(0.3rem,0.46vw,0.4rem);letter-spacing:0.85em;padding-right:0.85em;
  color:rgba(255,255,255,0);text-decoration:none!important;cursor:none;z-index:10;
  animation:fadeIn 1s 6.3s ease forwards;transition:color .5s;
}
.enter:hover{color:rgba(255,255,255,0.28)!important}

@keyframes up{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{to{color:rgba(255,255,255,0.15)}}
</style>
</head>
