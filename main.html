  width:clamp(260px,70vw,440px);}
@media(min-width:769px){.sig-img{width:clamp(240px,22vw,340px);}}
@keyframes write{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0% 0 0)}}
.rule{width:0;height:1px;background:linear-gradient(to right,transparent,rgba(195,200,205,0.2),transparent);animation:grow 0.7s 5.1s ease forwards;}
@keyframes grow{to{width:clamp(55px,7vw,100px)}}
.city{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;
  font-size:clamp(0.37rem,0.58vw,0.5rem);letter-spacing:0.66em;padding-right:0.66em;
  color:rgba(195,200,205,0);text-align:center;text-transform:uppercase;
  animation:fadeIn 1.2s 5.5s ease forwards;}
.enter{position:fixed;bottom:clamp(9px,1.4vh,14px);left:0;right:0;text-align:center;display:block;
  font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;
  font-size:clamp(0.3rem,0.46vw,0.4rem);letter-spacing:0.85em;padding-right:0.85em;
  color:rgba(195,200,205,0);text-decoration:none!important;cursor:none;z-index:10;
  animation:fadeIn 1s 6.3s ease forwards;transition:color .5s;}
.enter:hover{color:rgba(195,200,205,0.3)!important}
@keyframes up{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{to{color:rgba(195,200,205,0.18)}}
